# E2E overlay for the production stack: adds Mailpit, publishes postgres and mailpit on loopback for
# the test runner, and swaps in a Caddy that issues an internal certificate and forwards a test IP.
#   docker compose --env-file docker/e2e.env -f docker-compose.prod.yml -f docker-compose.e2e.yml up -d --wait
services:
  postgres:
    ports:
      - "127.0.0.1:${E2E_PG_PORT:-55432}:5432"
    # Ports are not published from an internal-only network, so the test stack also joins egress.
    networks: [internal, egress]
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${E2E_MAILPIT_UI_PORT:-18025}:8025"
      - "127.0.0.1:${E2E_MAILPIT_SMTP_PORT:-11025}:1025"
    networks: [internal, egress]
  caddy:
    ports: !override
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
    volumes: !override
      - ./docker/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
