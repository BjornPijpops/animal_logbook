name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animal
          POSTGRES_PASSWORD: animal
          POSTGRES_DB: animal_logbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animal" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://animal:animal@localhost:5432/animal_logbook_test
      TEST_DATABASE_URL: postgres://animal:animal@localhost:5432/animal_logbook_test
      AUTH_SECRET: ci-only-secret-not-for-production-use
      FILE_TOKEN_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies must be clean. Optional peers are omitted because the image never
      # installs them (drizzle-kit is only better-auth's optional peer; it is a devDependency here).
      - name: Audit production dependencies (fails the build)
        run: npm audit --omit=dev --omit=optional
      - name: Audit everything (report only, dev tooling findings do not fail the build)
        run: npm audit || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Date-sensitive suites with a frozen clock
        run: npm run test:clock
      - run: npm run build

  # Builds the production image once, scans it, and runs the whole Playwright suite against it
  # through the production compose stack (Caddy -> web, worker, migrate, postgres) plus Mailpit.
  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: animal-logbook:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (fails on critical vulnerabilities that have a fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.APP_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E against the image
        run: npm run e2e:image
      - name: Backup and restore drill
        run: ./deploy/restore-drill.sh
      - name: Stack logs
        if: failure()
        run: |
          docker compose -p animal-logbook-prod --env-file docker/e2e.env -f docker-compose.prod.yml -f docker-compose.e2e.yml logs --no-color --tail 200 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
      # Optional: set the repository variable PUBLISH_IMAGE=true to push to GitHub Container Registry
      # (free for public repositories). Tags: the git SHA, and `latest` on main.
      - name: Log in to GHCR
        if: github.event_name == 'push' && vars.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name == 'push' && vars.PUBLISH_IMAGE == 'true'
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag "$APP_IMAGE" "$repo:${{ github.sha }}"
          docker push "$repo:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "$APP_IMAGE" "$repo:latest"
            docker push "$repo:latest"
          fi
