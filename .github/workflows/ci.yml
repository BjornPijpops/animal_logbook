name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animal
          POSTGRES_PASSWORD: animal
          POSTGRES_DB: animal_logbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animal" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://animal:animal@localhost:5432/animal_logbook_test
      TEST_DATABASE_URL: postgres://animal:animal@localhost:5432/animal_logbook_test
      AUTH_SECRET: ci-only-secret-not-for-production-use
      FILE_TOKEN_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies must be clean. Optional peers are omitted because the image never
      # installs them (drizzle-kit is only better-auth's optional peer; it is a devDependency here).
      - name: Audit production dependencies (fails the build)
        run: npm audit --omit=dev --omit=optional
      - name: Audit everything (report only, dev tooling findings do not fail the build)
        run: npm audit || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Date-sensitive suites with a frozen clock
        run: npm run test:clock
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animal
          POSTGRES_PASSWORD: animal
          POSTGRES_DB: animal_logbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animal" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_URL: http://localhost:3000
      DATABASE_OWNER_URL: postgres://animal:animal@localhost:5432/animal_logbook
      DATABASE_URL: postgres://animal_app:animal_app@localhost:5432/animal_logbook
      WORKER_DATABASE_URL: postgres://animal_worker:animal_worker@localhost:5432/animal_logbook
      APP_DB_PASSWORD: animal_app
      WORKER_DB_PASSWORD: animal_worker
      AUTH_SECRET: ci-only-secret-not-for-production-use
      FILE_TOKEN_SECRET: ci-only-secret-not-for-production-use
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:roles
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
