# Development services. Production uses docker-compose.prod.yml (Phase 8).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: animal
      POSTGRES_PASSWORD: animal
      POSTGRES_DB: animal_logbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animal -d animal_logbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Optional virus scanning: docker compose --profile scan up -d
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "3310:3310"

volumes:
  pgdata:
